
name: mapdata

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
     
      - name: 生成时间
        id: ts
        run: |
          echo "utcs=$(TZ=Asia/Shanghai date +%Y-%m-%d_%H:%M)" >> $GITHUB_OUTPUT

      - name: 上传Release
        uses: ncipollo/release-action@v1
        with:
          name: MapData
          tag: MapData
          body: |
                 ### ${{ steps.ts.outputs.utcs }}
                   - AzerothCore-WoTLK地图数据，单独打包，按需
                     下载，包含zh-CN的dbc解决技能与语言兼容问题。
                   - AzerothCore WoTLK map data, packaged separately, on-demand
                     Download dbc with zh CN to solve skills and language compatibility issues.
          artifacts: |
                     dbc.zip
                     maps.zip
                     mmaps.zip
                     vmaps.zip
                     Cameras.zip
          allowUpdates: true
          replaceArtifacts: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_AZEROTHCORE }}
